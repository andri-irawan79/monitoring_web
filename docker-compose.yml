# Basis data + backend. Frontend dijalankan terpisah (cd frontend && npm install && npm run dev).
# Persiapan:  cp backend/.env.example backend/.env   lalu ganti JWT_SECRET_KEY dan SIMULATOR_API_KEY.
# Skema dasar dijalankan HANYA saat volume `pgdata` baru. Mengulang dari nol:  docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in root .env}"
      POSTGRES_DB: monitoring_durian
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000_base_schema.sql:/docker-entrypoint-initdb.d/00_base.sql:ro
      - ./backend/migrations/002_fis1_fis2_multi_fertilizer.sql:/docker-entrypoint-initdb.d/10_fis.sql:ro
      - ./backend/migrations/003_add_soil_moisture.sql:/docker-entrypoint-initdb.d/20_soil_moisture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoring_durian"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: monitoring_durian
      DB_USER: postgres
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in root .env}"
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  pgdata:
