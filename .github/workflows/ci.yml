name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_durian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Pasang dependensi
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (hanya galat sintaks dan nama tak terdefinisi)
        run: ruff check backend --select E9,F63,F7,F82
      - name: Uji (paritas, acuan terkunci, crisp, monotonik, kewajaran, validasi, konsistensi migrasi)
        working-directory: backend
        run: pytest -q
      - name: Reproduksi tabel acuan terkunci v1.2
        run: |
          python riset/susun_acuan_v1_2.py
          git diff --exit-code -- riset/tabel_acuan_v1_2.json riset/tabel_acuan_v1_2.sha256 riset/kasus_uji_acuan_v1_2.csv riset/kasus_uji_acuan_ph_v1_2.csv
      - name: Migrasi instalasi baru (000 -> 002 -> 003 -> 004) dan idempotensi
        run: |
          for kali in 1 2; do
            for f in 000_base_schema 002_fis1_fis2_multi_fertilizer 003_add_soil_moisture 004_growth_phase_matrix_v1_1; do
              psql -h localhost -U postgres -d monitoring_durian -v ON_ERROR_STOP=1 -q -f backend/migrations/$f.sql
            done
          done
          psql -h localhost -U postgres -d monitoring_durian -v ON_ERROR_STOP=1 -q -c "SELECT 1 / CASE WHEN to_regclass('public.rekomendasi_varietas_archive') IS NOT NULL AND to_regclass('public.rekomendasi_detail') IS NOT NULL THEN 1 ELSE 0 END;"
      - name: Build image backend Docker
        run: docker build -f backend/Dockerfile -t durian-monitoring:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
